name: Daily prayer times

on:
  schedule:
    -cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: action/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scraper_bot>py
        env:
          BOT_TOKEN: ${{secrets.BOT_TOKEN}}

